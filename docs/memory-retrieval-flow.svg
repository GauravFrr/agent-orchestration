<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 680" font-family="monospace, 'Courier New'" font-size="12">
  <!-- Background -->
  <rect width="950" height="680" fill="#0f1117"/>

  <!-- Title -->
  <text x="475" y="32" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold">Memory-Informed Planning &amp; Retrieval Flow</text>
  <text x="475" y="50" text-anchor="middle" fill="#64748b" font-size="11">Sequence Diagram — Task Intake, Vector Similarity Query, Context Injection, &amp; Async Memory Extraction</text>

  <!-- Lifeline Columns (Header Boxes) -->
  <!-- 1. Client / User -->
  <rect x="25" y="70" width="115" height="40" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="82" y="94" text-anchor="middle" fill="#93c5fd" font-weight="bold">Client / User</text>
  <line x1="82" y1="110" x2="82" y2="630" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 2. FastAPI API -->
  <rect x="155" y="70" width="115" height="40" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="212" y="94" text-anchor="middle" fill="#93c5fd" font-weight="bold">Task API</text>
  <line x1="212" y1="110" x2="212" y2="630" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 3. Supervisor (plan) -->
  <rect x="285" y="70" width="135" height="40" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="352" y="94" text-anchor="middle" fill="#a5b4fc" font-weight="bold">Supervisor (plan)</text>
  <line x1="352" y1="110" x2="352" y2="630" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 4. Memory Manager -->
  <rect x="435" y="70" width="135" height="40" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="502" y="94" text-anchor="middle" fill="#c4b5fd" font-weight="bold">Memory Manager</text>
  <line x1="502" y1="110" x2="502" y2="630" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 5. ChromaDB Store -->
  <rect x="585" y="70" width="125" height="40" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="647" y="94" text-anchor="middle" fill="#c4b5fd" font-weight="bold">ChromaDB Store</text>
  <line x1="647" y1="110" x2="647" y2="630" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 6. Postgres DB -->
  <rect x="725" y="70" width="105" height="40" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="777" y="94" text-anchor="middle" fill="#67e8f9" font-weight="bold">Postgres DB</text>
  <line x1="777" y1="110" x2="777" y2="630" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- 7. LLM Provider -->
  <rect x="845" y="70" width="90" height="40" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="890" y="94" text-anchor="middle" fill="#86efac" font-weight="bold">LLM Provider</text>
  <line x1="890" y1="110" x2="890" y2="630" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Steps -->

  <!-- Step 1: Submit task -->
  <line x1="82" y1="135" x2="212" y2="135" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="147" y="128" text-anchor="middle" fill="#93c5fd" font-size="10">1. POST /tasks {request_text}</text>

  <!-- Step 2: Enter plan node -->
  <line x1="212" y1="165" x2="352" y2="165" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrowIndigo)"/>
  <text x="282" y="158" text-anchor="middle" fill="#a5b4fc" font-size="10">2. Enter plan node</text>

  <!-- Step 3: Retrieve context -->
  <line x1="352" y1="195" x2="502" y2="195" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="427" y="188" text-anchor="middle" fill="#c4b5fd" font-size="10">3. retrieve_context(request_text)</text>

  <!-- Step 4: ChromaDB query -->
  <line x1="502" y1="225" x2="647" y2="225" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="574" y="218" text-anchor="middle" fill="#c4b5fd" font-size="10">4. query_collection('plans'/'facts'/'prefs')</text>

  <line x1="647" y1="255" x2="502" y2="255" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowPurple)"/>
  <text x="574" y="248" text-anchor="middle" fill="#c4b5fd" font-size="10">5. Matching vector embeddings &amp; metadata</text>

  <!-- Step 5: Update Postgres stats -->
  <line x1="502" y1="285" x2="777" y2="285" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <text x="639" y="278" text-anchor="middle" fill="#67e8f9" font-size="10">6. Update retrieval stats &amp; score in Postgres</text>

  <!-- Step 6: Formatted context returned -->
  <line x1="502" y1="315" x2="352" y2="315" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowIndigo)"/>
  <text x="427" y="308" text-anchor="middle" fill="#c4b5fd" font-size="10">7. Inject 'RETRIEVED CONTEXT' block</text>

  <!-- Step 7: Planning LLM Call -->
  <line x1="352" y1="350" x2="890" y2="350" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="621" y="343" text-anchor="middle" fill="#86efac" font-size="10">8. Supervisor chat_completion(prompt + past_experience)</text>

  <line x1="890" y1="380" x2="352" y2="380" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowIndigo)"/>
  <text x="621" y="373" text-anchor="middle" fill="#86efac" font-size="10">9. Return structured Plan (subtasks + confidence)</text>

  <!-- Phase Divider: Post Execution -->
  <line x1="50" y1="410" x2="900" y2="410" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="475" y="425" text-anchor="middle" fill="#64748b" font-size="10" font-weight="bold">POST-TASK COMPLETION — ASYNC MEMORY EXTRACTION</text>

  <!-- Step 8: Task Completed -->
  <line x1="212" y1="455" x2="502" y2="455" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="357" y="448" text-anchor="middle" fill="#c4b5fd" font-size="10">10. create_memories(task_id, plan, status='done')</text>

  <!-- Step 9: LLM Extraction -->
  <line x1="502" y1="490" x2="890" y2="490" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="696" y="483" text-anchor="middle" fill="#86efac" font-size="10">11. Extract facts &amp; user preferences via LLM</text>

  <line x1="890" y1="520" x2="502" y2="520" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowPurple)"/>
  <text x="696" y="513" text-anchor="middle" fill="#86efac" font-size="10">12. Extracted MemoryExtraction schema</text>

  <!-- Step 10: Persist Memories -->
  <line x1="502" y1="555" x2="777" y2="555" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <text x="639" y="548" text-anchor="middle" fill="#67e8f9" font-size="10">13. INSERT into public.memories</text>

  <line x1="502" y1="585" x2="647" y2="585" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="574" y="578" text-anchor="middle" fill="#c4b5fd" font-size="10">14. add_to_collection(plans, facts, prefs)</text>

  <!-- Markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#3b82f6"/>
    </marker>
    <marker id="arrowIndigo" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#6366f1"/>
    </marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowCyan" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#06b6d4"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#22c55e"/>
    </marker>
  </defs>
</svg>
